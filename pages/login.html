<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - R.D.G</title>
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="shortcut icon" href="../imagens/club.jpg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="container">
        <div id="topo">
            <img src="../imagens/rdg.png" alt>
            <h1><i class="fas fa-crown"></i> R . D . G <i class="fas fa-crown"></i></h1>
        </div>

        <!-- MENU PRINCIPAL -->
        <div id="menu">

            <!-- Esse botão não abre página nenhuma, ele só existe pra o JS pegar e abrir o menu lateral -->
            <a href="javascript:void(0);" id="menu-toggle">☰</a>

            <div class="menu-links">
                <a href="../index.html">Home</a>
                <a href="#">Login</a>
                <a href="#direitos">Contato</a>
            </div>
        </div>

        <!-- MENU LATERAL -->
        <div id="menu-lateral">

            <!-- Esse botão também não vai pra lugar algum, é só o que o JS usa para fechar o menu -->
            <a href="javascript:void(0);" id="close-btn">×</a>

            <a href="../index.html">Home</a>
            <a href="produtos.html">Produtos</a>
            <a href="#direitos">Contato</a>
        </div>

        <!-- TELA DE LOGIN -->
        <div id="tela-login">
            <h1>Já possui uma conta?</h1>
            <h4>Informe suas informações para logar!</h4>

            <form id="form-login">
                <input type="text" placeholder="Usuário" required>
                <input type="password" placeholder="Senha" required>
                <button type="submit">Entrar</button>
            </form>

            <p>Não tem conta? <a href="#">Cadastre-se</a></p>
        </div>

        <!-- Aqui o HTML chama o JS externo, que é o responsável por fazer o menu aparecer e sumir -->
        <script src="../js/script.js"></script>
    </div>

    <footer>
        <div id="direitos">
            <p>&#169 Direitos reservados - Isac Nichollas Melo dos Santos & Gabriel Veríssimo</p> <br>
            <p>Contato: 4002 8922</p>
            <div id="redesocial">
                <a href="https://github.com/"><img src="../imagens/25231.png" alt="" width="5%"></a>
                <a href="#"><img src="../imagens/instagram.png" alt="" width="5%"></a>
            </div>
        </div>
    </footer>
</body>

</html>
